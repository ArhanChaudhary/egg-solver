# Build for the CPU of the build machine (AVX2/AVX-512, BMI2 on x86). Only
# for x86_64 targets: "native" would name the host CPU when cross-compiling,
# and aarch64 targets already default to a NEON CPU (apple-m1 on macOS). For
# portable binaries see docs/reference/USER_GUIDE.md ("Portable builds").
[target.'cfg(target_arch = "x86_64")']
rustflags = ["-C", "target-cpu=native"]

# WebAssembly: SIMD128 (the `wasm` backend; every current browser, Node and
# wasmtime have it), and for the threads target a 4 GiB maximum for its
# shared memory (the linker's default for it is 1 GiB, too small for h5+).
# See docs/reference/USER_GUIDE.md ("WebAssembly").
[target.'cfg(target_arch = "wasm32")']
rustflags = ["-C", "target-feature=+simd128"]

[target.wasm32-wasip1-threads]
rustflags = ["-C", "link-arg=--max-memory=4294967296"]
