[package]
name = "cubeopt"
version = "0.1.0"
edition = "2021"

[dependencies]
crossbeam-utils = "0.8"
hashbrown = "0.16"
libc = "0.2"
# The library's error types (`tables::TableError`, `cubie::FaceletError`).
thiserror = "2"

[build-dependencies]
# (build.rs includes src/cubie.rs.)
thiserror = "2"

# parking_lot only where it can park a thread on stable Rust (not on wasm:
# see lanes/share.rs).
[target.'cfg(not(target_family = "wasm"))'.dependencies]
parking_lot = "0.12"

[features]
# Force the portable scalar backend (to test it on any machine).
scalar = []

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "abort"
debug = 1

[profile.test]
opt-level = 3

[lints.clippy]
pedantic = { level = "warn", priority = -1 }
# Hot kernels use `#[inline(always)]` deliberately (measured).
inline_always = "allow"

# The WebAssembly module (`wasm/`, see README.md "WebAssembly"); `cargo
# build` here still builds only this package.
[workspace]
members = [".", "wasm"]

# The WebAssembly module's build (`wasm/build.sh`): release without debug
# info, for a small `.wasm`.
[profile.wasm-release]
inherits = "release"
debug = 0
strip = true
