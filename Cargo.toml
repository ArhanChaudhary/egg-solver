[package]
name = "cubeopt"
version = "0.1.0"
edition = "2021"

[dependencies]
libc = "0.2"

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "abort"
debug = 1

[profile.test]
opt-level = 3

[lints.clippy]
pedantic = { level = "warn", priority = -1 }
# Hot kernels use `#[inline(always)]` deliberately (measured).
inline_always = "allow"
