<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>egg-solver: optimal Rubik's Cube solver</title>
<meta name="description" content="Find the shortest solution of any Rubik's Cube in your browser, from a scramble or from the colours of your cube.">
<script>
  // The threads build needs a cross-origin isolated page. egg-solver.arhan.sh (Cloudflare) and
  // wasm/serve.mjs send the headers for it; on a host that cannot, coi-sw.js adds them: register
  // it and reload once, so that this page is served through it. If the browser still refuses,
  // the page runs on one thread.
  (async () => {
    if (window.crossOriginIsolated || !window.isSecureContext || !('serviceWorker' in navigator)) return;
    try {
      await navigator.serviceWorker.register('coi-sw.js');
      await navigator.serviceWorker.ready;
      if (!navigator.serviceWorker.controller && !sessionStorage.getItem('coi-reloaded')) {
        sessionStorage.setItem('coi-reloaded', '1');
        location.reload();
      }
    } catch (error) {
      console.warn('cross-origin isolation service worker:', error);
    }
  })();
</script>
<style>
  :root { --bg: #fdfdfc; --fg: #1d1d1b; --muted: #6b6b66; --line: #d9d8d3; --accent: #2f5fa7; --bad: #c0177f; --sticker-gap: #26262a; }
  @media (prefers-color-scheme: dark) {
    :root { --bg: #1b1b1a; --fg: #e9e8e4; --muted: #a09f99; --line: #3a3a37; --accent: #7aa5e8; --bad: #ff7ac8; --sticker-gap: #0e0e10; }
  }
  [hidden] { display: none !important; }
  body { background: var(--bg); color: var(--fg); font: 16px/1.5 system-ui, sans-serif; margin: 0 auto; max-width: 34rem; padding: 1.25rem 1rem 3rem; }
  header { display: flex; align-items: baseline; justify-content: space-between; gap: 1rem; }
  h1 { font-size: 1.5rem; margin: 0; }
  nav { display: flex; gap: 1rem; font-size: 0.9rem; }
  a { color: var(--accent); }
  .muted { color: var(--muted); }
  .tagline { margin: 0.15rem 0 1.5rem; }
  form { display: flex; gap: 0.5rem; }
  input[type=text], button { font: inherit; color: inherit; border: 1px solid var(--line); border-radius: 6px; }
  input[type=text] { flex: 1; min-width: 0; padding: 0.5rem 0.65rem; background: var(--bg); font-family: ui-monospace, monospace; }
  input[type=text][aria-invalid=true] { border-color: var(--bad); }
  button { cursor: pointer; background: var(--bg); }
  button:disabled { opacity: 0.5; cursor: default; }
  button.primary { background: var(--accent); border-color: var(--accent); color: var(--bg); font-weight: 600; padding: 0.5rem 1.3rem; min-width: 5.5rem; }
  button.link { border: 0; padding: 0; background: none; color: var(--accent); text-decoration: underline; font-size: 0.9rem; white-space: nowrap; }
  .under { display: flex; justify-content: space-between; align-items: start; gap: 1rem; min-height: 1.5rem; margin: 0.35rem 0 1.25rem; font-size: 0.9rem; }
  .under .links { display: flex; gap: 1rem; margin-left: auto; }
  #status.bad { color: var(--bad); }
  .hint { text-align: center; font-size: 0.9rem; margin: 0.75rem 0 0; }
  .moves { display: flex; flex-wrap: wrap; justify-content: center; gap: 0.2rem; margin: 0.5rem 0 0.75rem; font-family: ui-monospace, monospace; font-size: 1.15rem; }
  .moves button { border-color: transparent; padding: 0.05rem 0.4rem; min-width: 2.2rem; }
  .moves button.done { color: var(--muted); }
  .moves button[aria-current=step] { border-color: var(--accent); }
  .player { display: flex; align-items: center; gap: 0.75rem; }
  .player input { flex: 1; min-width: 0; accent-color: var(--accent); }
  #play { flex: none; width: 2.6rem; height: 2.6rem; border-radius: 50%; border-color: var(--accent); color: var(--accent); padding: 0; }
  #play svg { display: block; width: 1rem; height: 1rem; margin: auto; fill: currentColor; }
  #play .pause, #play.playing .play { display: none; }
  #play.playing .pause { display: block; }
  .summary { text-align: center; margin: 0.75rem 0 0; }
</style>
</head>
<body>
<header>
  <h1>egg-solver</h1>
  <nav><a href="docs/index.html">Docs</a><a href="https://github.com/ArhanChaudhary/egg-solver">GitHub</a></nav>
</header>
<p class="tagline muted">The shortest solution to any Rubik's Cube, found in your browser.</p>

<form id="form">
  <input id="scramble" type="text" aria-label="Scramble" placeholder="Scramble, e.g. R U R' U' F2 D L2 B'" autocapitalize="characters" autocomplete="off" autocorrect="off" spellcheck="false">
  <button id="solve" class="primary" disabled>Solve</button>
</form>
<div class="under">
  <span id="status" role="status" class="muted"></span>
  <span class="links">
    <button id="change" type="button" class="link" hidden>Edit cube</button>
    <button id="random" type="button" class="link">Random scramble</button>
  </span>
</div>

<div id="edit">
  <div id="net"></div>
  <p class="hint muted">Type a scramble, or paint your cube: white on top, green in front.</p>
</div>

<section id="solution" hidden aria-label="The solution">
  <div id="cube"></div>
  <div id="moves" class="moves" role="group" aria-label="The solution: choose a move to see the cube after it"></div>
  <div class="player">
    <button id="play" type="button" aria-label="Play the solution">
      <svg class="play" viewBox="0 0 10 10" aria-hidden="true"><path d="M2 0.5 9.5 5 2 9.5z"/></svg>
      <svg class="pause" viewBox="0 0 10 10" aria-hidden="true"><path d="M1.5 0.5h2.5v9h-2.5zM6 0.5h2.5v9h-2.5z"/></svg>
    </button>
    <input id="step" type="range" min="0" max="1" step="1" value="0" aria-label="Moves done">
  </div>
  <p id="summary" class="summary"></p>
</section>

<script type="module">
import { FACES, SOLVED, applyMove, applyMoves, formatMoves, isSolved, moveName, parseMoves } from './cube-model.mjs';
import { COLOURS, COLOUR_NAMES, CubeInput } from './cube-input.mjs';
import { Cube3D } from './cube-3d.mjs';

const $ = (id) => document.getElementById(id);
const field = $('scramble');
const status = (text, bad = false) => {
  $('status').textContent = text;
  $('status').classList.toggle('bad', bad);
  $('status').classList.toggle('muted', !bad);
};

// --- The solving data: a pruning table hk (with its base, for h4) ---
// Laptops and desktops get h4 of base 8 (464 MiB, about ten seconds to make); phones, tablets
// and devices with little memory h3 (232 MiB). One that cannot be made falls back to a smaller
// one. A made table is kept in IndexedDB, so later visits load it in about a second.
const KINDS = { '4:8': { k: 4, base: 8 }, 3: { k: 3, base: 0 }, 2: { k: 2, base: 0 }, 0: { k: 0, base: 0 } };
const SMALLER = { '4:8': '3', 3: '2', 2: '0' };
// (iPadOS Safari says it is a Mac.)
const handheld = navigator.userAgentData?.mobile
  || /iPhone|iPad|iPod|Android/i.test(navigator.userAgent)
  || (/Macintosh/.test(navigator.userAgent) && navigator.maxTouchPoints > 1)
  || matchMedia('(pointer: coarse)').matches
  || (navigator.deviceMemory ?? 8) <= 4;
let kind = handheld ? '3' : '4:8';

const DB = 'egg-solver';
const STORE = 'tables';
const key = (t) => `${t}-v1`;
const db = () => new Promise((resolve, reject) => {
  const r = indexedDB.open(DB, 1);
  r.onupgradeneeded = () => r.result.createObjectStore(STORE);
  r.onsuccess = () => resolve(r.result);
  r.onerror = () => reject(r.error);
});
const store = async (mode, f) => {
  const d = await db();
  return new Promise((resolve, reject) => {
    const r = f(d.transaction(STORE, mode).objectStore(STORE));
    r.onsuccess = () => resolve(r.result);
    r.onerror = () => reject(r.error);
  });
};
const cached = (t) => store('readonly', (s) => s.get(key(t))).catch(() => undefined);
const keep = (t, blob) => store('readwrite', (s) => s.put(blob, key(t)));
const forget = (t) => store('readwrite', (s) => s.delete(key(t))).catch(() => undefined);
/** Delete the tables that this page does not use (other kinds that earlier versions of it kept). */
const tidy = () => store('readwrite', (s) => {
  const keys = s.getAllKeys();
  keys.addEventListener('success', () => {
    for (const k of keys.result) if (k !== key(kind)) s.delete(k);
  });
  return keys;
}).catch(() => undefined);
try {
  // (settings of earlier versions of this page)
  for (const name of ['tables', 'metric', 'input', 'colours', 'cube']) localStorage.removeItem(`egg-solver-${name}`);
} catch { /* (blocked storage: nothing to remove) */ }

// --- The solver worker (demo-worker.mjs) ---
let worker = null;
let nextId = 0;
let onProgress = null;
const pending = new Map();
const startWorker = () => {
  worker = new Worker(new URL('./demo-worker.mjs', import.meta.url), { type: 'module' });
  worker.onmessage = ({ data }) => {
    if ('progress' in data) {
      onProgress?.(data.progress);
      return;
    }
    const p = pending.get(data.id);
    if (!p) return;
    pending.delete(data.id);
    'error' in data ? p.reject(new Error(data.error)) : p.resolve(data.result);
  };
  worker.onerror = (e) => {
    for (const p of pending.values()) p.reject(new Error(e.message || 'the solver failed'));
    pending.clear();
  };
};
const stopWorker = (reason) => {
  worker?.terminate();
  worker = null;
  for (const p of pending.values()) p.reject(new Error(reason));
  pending.clear();
};
const call = (cmd, args = {}) => new Promise((resolve, reject) => {
  const id = nextId++;
  pending.set(id, { resolve, reject });
  worker.postMessage({ id, cmd, ...args });
});

let ready = false;
let solving = false;
const buttons = () => {
  $('solve').textContent = solving ? 'Stop' : 'Solve';
  $('solve').disabled = !ready && !solving;
  $('random').disabled = field.readOnly = solving;
};

// Each start is a session; one that a newer start replaced stops at its next step.
let sessions = 0;
const current = (session) => {
  if (session !== sessions) throw new Error('restarted');
};

/** The table from IndexedDB, else made here (and then kept). */
const prepareTable = async (session) => {
  const blob = await cached(kind);
  current(session);
  if (blob) {
    onProgress = (share) => status(`Loading… ${Math.round(100 * share)}%`);
    try {
      await call('load', { source: blob, verify: true });
      return;
    } catch (e) {
      // (a stopped worker, or no room for the table: keep it; a damaged copy: make it again)
      if (e.message === 'restarted' || e.message === 'stopped' || /room|memory/i.test(e.message)) throw e;
      await forget(kind);
    } finally {
      onProgress = null;
    }
  }
  const t0 = performance.now();
  const timer = setInterval(() => status(`Getting ready (first visit only)… ${Math.round((performance.now() - t0) / 1000)} s`), 250);
  try {
    await call('generate', { k: KINDS[kind].k, base: KINDS[kind].base, metric: 'htm' });
  } finally {
    clearInterval(timer);
  }
  // Keep it for the next visit (in the background; a failure only costs making it again).
  const made = kind;
  call('export').then((file) => keep(made, file)).catch(() => undefined);
};

/** Start the solver with every core the page may use, and its table. */
const cores = crossOriginIsolated ? Math.max(1, navigator.hardwareConcurrency || 1) : 1;
const start = async () => {
  const session = ++sessions;
  stopWorker('restarted');
  ready = false;
  buttons();
  status('Loading…');
  startWorker();
  try {
    await call('init', { threads: cores });
  } catch (e) {
    // (the threads build could not start: one thread)
    if (cores <= 1 || e.message === 'restarted') throw e;
    current(session);
    stopWorker('restarted');
    startWorker();
    await call('init', { threads: 1 });
  }
  try {
    await prepareTable(session);
  } catch (e) {
    const next = SMALLER[kind];
    if (!next || e.message === 'restarted' || e.message === 'stopped') throw e;
    console.warn(`the h${KINDS[kind].k} table:`, e);
    kind = next;
    return start();
  }
  current(session);
  ready = true;
  buttons();
  status('');
  tidy();
};
const run = (f) => f().catch((e) => {
  // (a solve stopped by ending the worker, or a start that a new one replaced)
  if (e.message === 'stopped' || e.message === 'restarted') return;
  status(`Something went wrong: ${e.message}`, true);
  solving = false;
  buttons();
});

// --- The cube to solve: what the scramble makes, or what was painted ---
const net = new CubeInput($('net'), {
  onPaint: () => {
    field.value = '';
    field.removeAttribute('aria-invalid');
    status('');
  },
});
// Phone keyboards substitute curly or look-alike apostrophes for the prime.
const primes = /[‘’‛′´`ʼʹ]/g;
const plain = (text) => text.replace(primes, "'").replace(/ /g, ' ');
/**
 * The field's text as stickers, or null if it is neither moves nor a cube given as its 54
 * stickers (six symbols, each centre's symbol standing for its face).
 */
const readCube = (text) => {
  const chars = [...text].filter((c) => !/\s/.test(c));
  if (chars.length === 54 && new Set(chars).size === 6 && !chars.some((c) => "123'".includes(c))) {
    const faces = new Map(FACES.map((f, i) => [chars[9 * i + 4], f]));
    return faces.size === 6 ? chars.map((c) => faces.get(c)).join('') : null;
  }
  const moves = parseMoves(text);
  return moves && applyMoves(SOLVED, moves);
};
const typed = () => {
  if (primes.test(field.value)) {
    const [s, e] = [field.selectionStart, field.selectionEnd];
    field.value = plain(field.value);
    field.setSelectionRange(s, e);
  }
  primes.lastIndex = 0;
  edit();
  status('');
  // (no colour in hand: a touch on the net cannot repaint the scramble's cube by accident)
  net.setBrush(null);
  CubeInput.forget();
  const text = field.value.trim();
  const stickers = text ? readCube(text) : SOLVED;
  if (stickers) {
    net.setStickers(stickers);
    field.removeAttribute('aria-invalid');
  } else {
    field.setAttribute('aria-invalid', 'true');
  }
};
field.addEventListener('input', typed);

$('random').onclick = () => {
  // 25 random turns: never the same face twice running, nor three turns of one axis (U D U).
  const axis = (face) => face % 3;
  const moves = [];
  while (moves.length < 25) {
    const face = Math.floor(Math.random() * 6);
    const [last, before] = [moves.at(-1), moves.at(-2)];
    if (last?.face === face) continue;
    if (last && before && axis(last.face) === axis(face) && axis(before.face) === axis(face)) continue;
    moves.push({ face, turns: 1 + Math.floor(Math.random() * 3) });
  }
  field.value = formatMoves(moves);
  typed();
};

/** A painted cube that cannot be solved: what is wrong, with the stickers concerned outlined. */
const showProblem = (problem) => {
  net.highlight(problem.stickers);
  if (problem.kind === 'counts') {
    const wrong = problem.counts.filter(([, n]) => n !== 9).map(([c, n]) => `${COLOUR_NAMES[c]} is on ${n}`);
    status(`Each colour belongs on 9 stickers, but ${wrong.join(', ')}.`, true);
  } else {
    status(`This cube cannot be solved: ${problem.message}.`, true);
  }
};

// --- Solving ---
const seconds = (s) => (s < 0.1 ? `${Math.max(1, Math.round(1000 * s))} ms` : s < 10 ? `${s.toFixed(1)} s` : `${Math.round(s)} s`);
const solve = async () => {
  if (field.getAttribute('aria-invalid')) {
    status("That is not a scramble: use the letters U R F D L B, each alone or followed by ' or 2.", true);
    return;
  }
  const problem = net.problem();
  if (problem) {
    showProblem(problem);
    return;
  }
  const cube = net.stickers();
  if (cube === SOLVED) {
    status('This cube is already solved.');
    return;
  }
  solving = true;
  buttons();
  const t0 = performance.now();
  // (most cubes take seconds; the few of 19 and 20 moves can take minutes)
  const timer = setInterval(() => {
    const s = (performance.now() - t0) / 1000;
    status(s < 15 ? `Solving… ${s.toFixed(1)} s` : `Solving… ${Math.round(s)} s (a hard cube: these can take minutes)`);
  }, 100);
  try {
    const r = await call('solve', { cube, lanes: 0, metric: 'htm' });
    status('');
    showSolution(cube, parseMoves(r.moves) ?? [], r.wall);
  } finally {
    clearInterval(timer);
    solving = false;
    buttons();
  }
};
$('form').addEventListener('submit', (e) => {
  e.preventDefault();
  if (solving) {
    // A solve cannot be interrupted inside the module: end the worker and start a new one (the
    // table comes back from this browser's storage).
    stopWorker('stopped');
    solving = false;
    run(start);
  } else if (ready) {
    run(solve);
  }
});

// --- The solution, replayed on a cube in 3D ---
const cube3d = new Cube3D($('cube'), COLOURS);
const still = matchMedia('(prefers-reduced-motion: reduce)');
const sleep = (ms) => new Promise((resolve) => { setTimeout(resolve, ms); });
let replay = null; // { states: the cube after 0, 1, ... moves, moves, at: moves done, playing }

/** Mark the moves done, and where the slider stands. */
const mark = (at) => {
  replay.at = at;
  $('step').value = at;
  [...$('moves').children].forEach((b, i) => {
    b.classList.toggle('done', i < at);
    if (i === at - 1) b.setAttribute('aria-current', 'step');
    else b.removeAttribute('aria-current');
  });
};
const playButton = () => {
  $('play').classList.toggle('playing', Boolean(replay?.playing));
  $('play').setAttribute('aria-label', replay?.playing ? 'Pause' : 'Play the solution');
};
/** Show the cube after `at` moves, at rest. */
const jump = (at) => {
  replay.playing = false;
  cube3d.show(replay.states[at]);
  mark(at);
  playButton();
};
/** Turn the moves from where the replay stands to the end (from the start, if it is at the end). */
const play = async () => {
  const mine = replay;
  const { states, moves } = mine;
  if (mine.at >= moves.length) jump(0);
  mine.playing = true;
  playButton();
  while (mine.playing && mine.at < moves.length) {
    const i = mine.at;
    if (still.matches) {
      await sleep(500);
      if (!mine.playing) break;
      cube3d.show(states[i + 1]);
    } else if (!await cube3d.turn(states[i], moves[i], states[i + 1], moves[i].turns === 2 ? 520 : 380)) {
      break;
    }
    if (replay !== mine || !mine.playing) break;
    mark(i + 1);
  }
  if (replay === mine && mine.at >= moves.length) {
    mine.playing = false;
    playButton();
  }
};
$('play').onclick = () => (replay.playing ? jump(replay.at) : play());
$('step').addEventListener('input', () => jump(Number($('step').value)));

const showSolution = (cube, moves, wall) => {
  const states = [cube];
  for (const move of moves) states.push(applyMove(states.at(-1), move));
  replay = { states, moves, at: 0, playing: false };
  $('moves').replaceChildren(...moves.map((move, i) => {
    const b = document.createElement('button');
    b.type = 'button';
    b.textContent = moveName(move);
    b.title = `The cube after move ${i + 1}`;
    b.onclick = () => jump(i + 1);
    return b;
  }));
  $('step').max = moves.length;
  $('summary').textContent = `${moves.length} move${moves.length === 1 ? '' : 's'} · shortest possible · ${seconds(wall)}`;
  $('edit').hidden = true;
  $('solution').hidden = $('change').hidden = false;
  jump(0);
  if (!isSolved(states.at(-1))) {
    status('This solution failed its check: please report this cube.', true);
    return;
  }
  // (a moment to see the scrambled cube, then the solution plays once)
  const mine = replay;
  sleep(500).then(() => { if (replay === mine && mine.at === 0 && !mine.playing) play(); });
};
/** Back to the net (the cube that was solved stays on it). */
const edit = () => {
  if (!replay) return;
  replay.playing = false;
  replay = null;
  cube3d.show(SOLVED);
  $('solution').hidden = $('change').hidden = true;
  $('edit').hidden = false;
};
$('change').onclick = edit;

// What the browser kept in the field over a reload, else the cube last painted here.
if (field.value.trim()) typed();
else if (CubeInput.painted()) net.setStickers(CubeInput.painted());

run(start);
</script>
</body>
</html>
